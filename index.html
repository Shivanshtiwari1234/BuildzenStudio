<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Buildzen Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
</head>

<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner"></div>

            <div class="loading-title">
                Buildzen Studio
            </div>

            <div id="loadingStatus" class="loading-status">
                HANDSHAKING...
            </div>
        </div>
    </div>

    <header class="topbar">
        <div class="brand">
            <strong>Buildzen</strong>
            <span>Studio</span>
        </div>

        <div class="topbar-right">
            <span id="status" class="status">
                <span class="status-dot"></span>
                Live
            </span>

            <button id="resetBtn" type="button">Reset</button>
            <button id="refreshBtn" type="button">Refresh</button>
        </div>
    </header>


    <main class="workspace">

        <aside class="file-panel">

            <div class="file-panel-header">
                <span>PROJECT</span>

                <button id="newFileBtn" class="new-file-btn" title="New File" aria-label="New File">
                    +
                </button>
            </div>

            <div id="fileTree" class="file-tree"></div>


            <div class="asset-section">

                <div class="asset-section-header">
                    <span>ASSETS</span>

                    <button id="uploadAssetBtn" class="new-file-btn" title="Upload Asset" aria-label="Upload Asset"
                        type="button">
                        +
                    </button>
                </div>

                <div id="assetTree" class="asset-tree">
                    <div class="empty-assets">
                        No assets yet
                    </div>
                </div>

                <input id="assetInput" type="file" multiple hidden>

            </div>
        </aside>


        <section class="editor-panel">

            <div class="editor-header">

                <div class="editor-title">
                    <span id="fileName">index.html</span>
                </div>

                <div class="editor-actions">

                    <button id="renameFileBtn" title="Rename file" type="button">
                        Rename
                    </button>

                    <button id="deleteFileBtn" title="Delete file" type="button">
                        Delete
                    </button>

                </div>

            </div>


            <div id="editorContainer" class="editor-container"></div>


            <div class="editor-footer">

                <span id="cursorInfo">
                    Ln 1, Col 1
                </span>

                <span>Spaces: 2</span>
                <span>UTF-8</span>

                <span id="languageInfo">
                    HTML
                </span>

            </div>

        </section>


        <section class="right-panel">

            <div class="preview-panel">

                <div class="panel-header">
                    <span>Preview</span>
                    <span id="previewStatus">Live</span>
                </div>


                <div class="browser-bar">

                    <div class="browser-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="browser-address">
                        buildzen://preview
                    </div>

                </div>


                <iframe id="preview" title="Live preview" sandbox="allow-scripts allow-forms allow-modals"></iframe>


                <div class="preview-footer">
                    <span>Buildzen Preview</span>
                    <span>Auto-refresh enabled</span>
                </div>

            </div>


            <div class="console-panel">

                <div class="panel-header console-header">

                    <div class="console-title">
                        <span>Console</span>
                        <span id="consoleCount">(0)</span>
                    </div>


                    <div class="console-controls">

                        <button class="console-filter active" data-filter="all" type="button">
                            All
                        </button>

                        <button class="console-filter" data-filter="log" type="button">
                            Logs
                        </button>

                        <button class="console-filter" data-filter="info" type="button">
                            Info
                        </button>

                        <button class="console-filter" data-filter="warn" type="button">
                            Warnings
                        </button>

                        <button class="console-filter" data-filter="error" type="button">
                            Errors
                        </button>

                        <button id="clearConsoleBtn" type="button">
                            Clear
                        </button>

                    </div>

                </div>


                <div id="consoleOutput" class="console-output"></div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         Buildzen Modal System
         ===================================================== -->

    <div id="modalOverlay" class="modal-overlay" aria-hidden="true">

        <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"
            aria-describedby="modalMessage">

            <div class="modal-header">

                <span id="modalTitle">
                    Buildzen
                </span>

                <button id="modalCloseBtn" class="modal-close" aria-label="Close" type="button">
                    ×
                </button>

            </div>


            <div class="modal-body">

                <div id="modalIcon" class="modal-icon info" aria-hidden="true">
                    i
                </div>


                <div class="modal-content">

                    <div id="modalMessage" class="modal-message"></div>


                    <input id="modalInput" class="modal-input" type="text" autocomplete="off" spellcheck="false"
                        aria-label="Input">

                </div>

            </div>


            <div class="modal-footer">

                <button id="modalCancelBtn" class="modal-btn modal-btn-secondary" type="button">
                    Cancel
                </button>

                <button id="modalConfirmBtn" class="modal-btn modal-btn-primary" type="button">
                    OK
                </button>

            </div>

        </div>

    </div>


    <script type="module" src="app.js"></script>

</body>

</html>
