<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buildzen Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div class="brand">
            <div class="logo">B</div>

            <div>
                <div class="brand-name">Buildzen Studio</div>
                <div class="brand-subtitle">Web Builder</div>
            </div>
        </div>

        <div class="topbar-actions">

            <span id="status" class="status">
                <span class="status-dot"></span>
                Ready
            </span>

            <button id="resetBtn">Reset</button>
            <button id="refreshBtn">Refresh</button>

        </div>

    </header>


    <main class="workspace">

        <!-- EDITOR -->

        <section class="editor-panel">

            <div class="panel-header">

                <div class="panel-title">
                    <span class="panel-icon html-icon">&lt;/&gt;</span>
                    HTML
                </div>

                <span id="lineCount">1 line</span>

            </div>

            <div id="editor"></div>

            <div class="editor-footer">

                <span id="cursorPosition">
                    Ln 1, Col 1
                </span>

                <span>Spaces: 2</span>
                <span>UTF-8</span>
                <span>HTML</span>

            </div>

        </section>


        <!-- PREVIEW -->

        <section class="preview-panel">

            <div class="panel-header">

                <div class="panel-title">
                    <span class="panel-icon preview-icon">▶</span>
                    Live Preview
                </div>

            </div>


            <div class="preview-container">

                <div class="browser-bar">

                    <div class="browser-buttons">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="browser-address">
                        buildzen://preview
                    </div>

                </div>

                <iframe id="preview" title="Live preview" sandbox="allow-scripts allow-forms allow-modals">
                </iframe>

            </div>


            <!-- CONSOLE -->

            <div class="console">

                <div class="console-header">

                    <div class="console-title">
                        <span>Console</span>
                        <span id="consoleCount">0</span>
                    </div>

                    <button id="clearConsole">
                        Clear
                    </button>

                </div>

                <div id="consoleOutput" class="console-output">

                    <div class="console-empty">
                        Console output will appear here...
                    </div>

                </div>

            </div>


            <div class="preview-footer">
                <span id="previewStatus">
                    Preview ready
                </span>
            </div>

        </section>

    </main>


    <script type="module" src="script.js"></script>

</body>

</html>
