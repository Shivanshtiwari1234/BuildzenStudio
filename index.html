<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buildzen Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP BAR -->

    <header class="topbar">

        <div class="brand">

            <div class="logo">
                B
            </div>

            <div>
                <div class="brand-name">
                    Buildzen Studio
                </div>

                <div class="brand-subtitle">
                    Build websites directly in your browser
                </div>
            </div>

        </div>


        <div class="topbar-right">

            <div class="status">
                <span class="status-dot"></span>
                Live preview
            </div>

            <button id="resetButton">
                Reset
            </button>

            <button class="run-button" id="runButton">
                Refresh Preview
            </button>

        </div>

    </header>


    <!-- WORKSPACE -->

    <main class="workspace">

        <!-- CODE PANEL -->

        <section class="panel">

            <div class="panel-header">

                <div class="panel-title">

                    <div class="panel-icon">
                        &lt;/&gt;
                    </div>

                    Code

                </div>

                <div class="panel-info" id="lineCount">
                    1 line
                </div>

            </div>


            <div class="editor">

                <div class="line-numbers" id="lineNumbers">
                    1
                </div>

                <textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off"
                    autocapitalize="off"></textarea>

            </div>


            <div class="panel-footer">

                <span>
                    HTML · CSS · JavaScript
                </span>

                <span>
                    Tab = indent
                </span>

            </div>

        </section>


        <!-- PREVIEW PANEL -->

        <section class="panel preview-panel">

            <div class="panel-header">

                <div class="panel-title">

                    <div class="panel-icon">
                        ◩
                    </div>

                    Preview

                </div>

                <div class="live">
                    ● LIVE
                </div>

            </div>


            <!-- PREVIEW -->

            <div class="preview-container">

                <div class="browser-bar">

                    <span class="browser-dot"></span>
                    <span class="browser-dot"></span>
                    <span class="browser-dot"></span>

                    <div class="address">
                        buildzen-preview.local
                    </div>

                </div>


                <iframe id="preview" title="Live preview" sandbox="allow-scripts allow-forms allow-modals"></iframe>

            </div>


            <!-- CONSOLE -->

            <div class="console">

                <div class="console-header">

                    <div class="console-title">

                        <span class="console-icon">
                            &gt;_
                        </span>

                        Console

                    </div>

                    <button class="console-clear" id="clearConsole">
                        Clear
                    </button>

                </div>


                <div class="console-output" id="consoleOutput"></div>

            </div>


            <div class="panel-footer">

                <span>
                    Live output
                </span>

                <span id="previewStatus">
                    Up to date
                </span>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
