<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buildzen Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div class="brand">
            <strong>Buildzen</strong>
            <span>Studio</span>
        </div>

        <div class="topbar-right">

            <span id="status" class="status">
                <span class="status-dot"></span>
                Live
            </span>

            <button id="resetBtn">
                Reset
            </button>

            <button id="refreshBtn">
                Refresh
            </button>

        </div>

    </header>


    <main class="workspace">

        <!-- PROJECT FILES -->
        <aside class="file-panel">

            <div class="file-panel-header">
                <span>PROJECT</span>
            </div>

            <div class="file-tree">

                <button class="file-item active" data-file="html">

                    <span class="file-icon html-icon">
                        &lt;&gt;
                    </span>

                    <span>
                        index.html
                    </span>

                </button>


                <button class="file-item" data-file="css">

                    <span class="file-icon css-icon">
                        #
                    </span>

                    <span>
                        style.css
                    </span>

                </button>


                <button class="file-item" data-file="js">

                    <span class="file-icon js-icon">
                        JS
                    </span>

                    <span>
                        script.js
                    </span>

                </button>

            </div>

        </aside>


        <!-- EDITOR -->
        <section class="editor-panel">

            <div class="editor-header">

                <div class="tabs">

                    <button class="tab active" data-editor="html">

                        HTML

                    </button>

                    <button class="tab" data-editor="css">

                        CSS

                    </button>

                    <button class="tab" data-editor="js">

                        JS

                    </button>

                </div>


                <div class="editor-title">
                    <span id="fileName">
                        index.html
                    </span>
                </div>

            </div>


            <div class="editor-container">

                <div id="htmlEditor" class="editor active-editor">
                </div>

                <div id="cssEditor" class="editor">
                </div>

                <div id="jsEditor" class="editor">
                </div>

            </div>


            <div class="editor-footer">

                <span id="cursorInfo">
                    Ln 1, Col 1
                </span>

                <span>
                    Spaces: 2
                </span>

                <span>
                    UTF-8
                </span>

                <span id="languageInfo">
                    HTML
                </span>

            </div>

        </section>


        <!-- RIGHT SIDE -->
        <section class="right-panel">

            <!-- PREVIEW -->
            <div class="preview-panel">

                <div class="panel-header">

                    <span>
                        Preview
                    </span>

                    <span id="previewStatus">
                        Live
                    </span>

                </div>


                <div class="browser-bar">

                    <div class="browser-dots">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <div class="browser-address">
                        buildzen://preview
                    </div>

                </div>


                <iframe id="preview" title="Live preview" sandbox="allow-scripts allow-forms allow-modals">
                </iframe>


                <div class="preview-footer">

                    <span>
                        Buildzen Preview
                    </span>

                    <span>
                        Auto-refresh enabled
                    </span>

                </div>

            </div>


            <!-- CONSOLE -->
            <div class="console-panel">

                <div class="panel-header console-header">

                    <div class="console-title">

                        <span>
                            Console
                        </span>

                        <span id="consoleCount">
                            (0)
                        </span>

                    </div>


                    <div class="console-controls">

                        <button class="console-filter active" data-filter="all">
                            All
                        </button>

                        <button class="console-filter" data-filter="log">
                            Logs
                        </button>

                        <button class="console-filter" data-filter="info">
                            Info
                        </button>

                        <button class="console-filter" data-filter="warn">
                            Warnings
                        </button>

                        <button class="console-filter" data-filter="error">
                            Errors
                        </button>

                        <button id="clearConsoleBtn">
                            Clear
                        </button>

                    </div>

                </div>


                <div id="consoleOutput" class="console-output">
                </div>

            </div>

        </section>

    </main>


    <script type="module" src="script.js">
    </script>

</body>

</html>
